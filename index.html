<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mãos Unidas - Gestão de Triagem e Distribuição</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #1a1a1a;
      --primary-color: #0d6efd;
      --border-color: #dee2e6;
      --table-header: #e9ecef;
      --alert-bg: #f8d7da;
      --alert-text: #721c24;
      --success-bg: #d4edda;
      --success-text: #155724;
    }

    body.high-contrast {
      --bg-color: #000000;
      --card-bg: #121212;
      --text-color: #ffffff;
      --primary-color: #ffff00;
      --border-color: #ffffff;
      --table-header: #333333;
      --alert-bg: #ff0000;
      --alert-text: #ffffff;
      --success-bg: #00ff00;
      --success-text: #000000;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 24px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    h1, h2 {
      margin: 0;
    }

    .btn {
      padding: 8px 16px;
      font-size: 14px;
      font-weight: bold;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      cursor: pointer;
      background-color: var(--primary-color);
      color: #ffffff;
    }

    body.high-contrast .btn {
      color: #000000;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    input, select {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background-color: var(--card-bg);
      color: var(--text-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 10px;
      text-align: left;
      font-size: 14px;
    }

    th {
      background-color: var(--table-header);
    }

    .status-alert {
      background-color: var(--alert-bg);
      color: var(--alert-text);
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
    }

    .msg-box {
      padding: 12px;
      border-radius: 4px;
      margin-top: 12px;
      display: none;
      font-size: 14px;
    }

    .msg-box.erro {
      display: block;
      background-color: var(--alert-bg);
      color: var(--alert-text);
    }

    .msg-box.sucesso {
      display: block;
      background-color: var(--success-bg);
      color: var(--success-text);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>Ação Comunitária Mãos Unidas</h1>
        <p>Sistema de Triagem FEFO e Controle de Carência</p>
      </div>
      <button class="btn" onclick="toggleContraste()">Alternar Alto Contraste</button>
    </header>

    <section class="card">
      <h2>1. Validação de Entrega (Regra de Carência: 30 dias)</h2>
      <div style="margin-top: 16px;">
        <label for="cpf">CPF do Beneficiário:</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" inputmode="numeric" oninput="aplicarMascaraCPF(this)">
          <button class="btn" style="white-space: nowrap;" onclick="verificarCarencia()">Validar e Registrar</button>
        </div>
      </div>
      <div id="resultadoCarencia" class="msg-box"></div>
    </section>

    <section class="card">
      <h2>2. Entrada de Donativos no Estoque</h2>
      <div class="form-grid" style="margin-top: 16px;">
        <div>
          <label for="descricao">Item / Alimento:</label>
          <input type="text" id="descricao" placeholder="Ex: Arroz Tipo 1">
        </div>
        <div>
          <label for="quantidade">Quantidade (kg/un):</label>
          <input type="number" id="quantidade" placeholder="Ex: 50">
        </div>
        <div>
          <label for="validade">Data de Validade:</label>
          <input type="date" id="validade">
        </div>
      </div>
      <button class="btn" onclick="cadastrarAlimento()">Adicionar ao Estoque</button>
    </section>
